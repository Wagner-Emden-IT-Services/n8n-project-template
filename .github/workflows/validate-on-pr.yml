name: Validate Workflows on PR

on:
  pull_request:
    branches: [main, staging]
  # Kein paths-Filter: validate laeuft auf jedem PR (auch fuer md-only-Changes).
  # Branch-Protection requirt 'validate' als Status-Check; ohne Trigger auf md-Files
  # wuerde der Check nie laufen → md-only-PRs waeren nicht mergbar.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit & Integration Tests
        run: npm test

      - name: Schema + Naming Validation
        run: node scripts/n8n-cli.mjs validate workflows

      - name: Normalize-Check (deterministische Diffs)
        run: node scripts/n8n-cli.mjs normalize workflows --check

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks Secret Scan
        # Direkter CLI-Aufruf statt gitleaks-action — letztere braucht seit Mid-2024
        # eine bezahlte Lizenz fuer Org-Repos. CLI ist MIT, kostenlos.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

      - name: Idempotency Heuristic (warning only)
        # Heuristik ist false-positive-anfaellig; daher nur Warnung,
        # echter Check via /check-idempotency lokal vor jedem Deploy.
        continue-on-error: true
        run: |
          if grep -rl --include="*.json" -i 'insert into' workflows/ | xargs grep -L -i 'on conflict\|upsert' 2>/dev/null | grep -q .; then
            echo "::warning::Moeglicherweise INSERT ohne ON CONFLICT/UPSERT — manuelle Pruefung empfohlen"
          fi
