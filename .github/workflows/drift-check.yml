name: Drift Check

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: 'Ziel-Env'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

jobs:
  drift:
    # Template-Guard: im Template-Repo selbst NICHT pruefen (keine echte n8n-Instanz).
    # Beim Fork/Use-Template aendert sich github.repository automatisch -> Job laeuft.
    if: github.repository != 'Wagner-Emden-IT-Services/n8n-project-template'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Drift-Check (prod)
        id: drift
        env:
          N8N_PROD_API_URL: ${{ secrets.N8N_PROD_API_URL }}
          N8N_PROD_API_KEY: ${{ secrets.N8N_PROD_API_KEY }}
          N8N_STAGING_API_URL: ${{ secrets.N8N_STAGING_API_URL }}
          N8N_STAGING_API_KEY: ${{ secrets.N8N_STAGING_API_KEY }}
        run: |
          ENV="${{ github.event.inputs.env || 'prod' }}"
          node scripts/n8n-cli.mjs drift-check --env=$ENV --output=drift-report.md

      - name: Open Issue on Drift
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Drift erkannt zwischen Repo und ${{ github.event.inputs.env || 'prod' }}-Instanz"
          content-filepath: drift-report.md
          labels: drift, automated
