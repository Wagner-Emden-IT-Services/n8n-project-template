# PR-Issue-Link-Check — n8n-template v1.7.0
#
# Informativer Hinweis wenn ein PR-Body keine Closes/Fixes-Referenz auf einen Issue
# enthaelt. Nicht-blocking — Konvention seit v1.7.0 ist `Closes #N`, aber niemand
# wird per CI-Fehler genoetigt. Bei Bedarf User-seitig auf `required` setzen.

name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  check-link:
    runs-on: ubuntu-latest
    steps:
      - name: Pruefe ob PR-Body Closes/Fixes-Ref enthaelt
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Pattern: "Closes #N", "Fixes #N", "Resolves #N", "Closes org/repo#N" — case-insensitive
            const hasLink = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+)?#\d+/i.test(body);

            if (hasLink) {
              console.log(`PR #${pr.number}: Issue-Link gefunden.`);
              return;
            }

            // Suche existierenden Bot-Comment (dedupe)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            const marker = '<!-- n8n-template-pr-link-check -->';
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            const commentBody = `${marker}

ℹ️  **PR-Issue-Link-Konvention (n8n-template v1.7.0)**

Dieser PR scheint kein `Closes #N` / `Fixes #N` zu enthalten. Dadurch greift die GitHub-Auto-Close-Mechanik beim Merge NICHT.

**Empfehlung:** PR-Body ergaenzen mit:

\`\`\`
Closes #<issue-number>
\`\`\`

Bei mehreren Issues: \`Closes #N, Closes #M, Closes #O\`.

(Nicht-blocking — falls dieser PR bewusst ohne Issue ist: ignorieren.)`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
              console.log(`PR #${pr.number}: Comment aktualisiert.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
              console.log(`PR #${pr.number}: Comment hinzugefuegt.`);
            }
