# Workflow-JSON Validation — n8n-template v0.6.1+
#
# Validiert alle workflows/*.json gegen n8n-Schema via scripts/n8n-cli.mjs validate.
# Pflicht-CI auf PRs gegen main/staging.

name: Validate Workflows

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'workflows/**.json'
      - 'scripts/n8n-cli.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Kein Step in diesem Job braucht authentifiziertes Git. Der Default
          # (true) schreibt den GITHUB_TOKEN in die lokale Git-Config, wo ihn
          # jeder im Job ausgefuehrte Dependency-Code lesen kann — npm ci zieht
          # hier Fremdcode.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Validate alle Workflows
        run: node scripts/n8n-cli.mjs validate workflows
