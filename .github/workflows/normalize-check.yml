# Workflow-JSON Normalize-Check — n8n-template v0.6.0
#
# Pre-Merge-Check: scheitert wenn workflows/*.json nicht normalisiert ist
# (z.B. position-Felder, versionId, instanceId noch drin).

name: Normalize Check

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'workflows/**.json'

permissions:
  contents: read

jobs:
  normalize-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Pruefe Normalize-Status
        run: |
          set -e
          NEEDS_NORMALIZE=()
          for wf in workflows/*.json; do
            [ -e "$wf" ] || continue
            # Normalize in temp-file und vergleiche
            TMP=$(mktemp)
            node scripts/n8n-cli.mjs normalize --in "$wf" --out "$TMP"
            if ! cmp -s "$wf" "$TMP"; then
              NEEDS_NORMALIZE+=("$wf")
            fi
            rm -f "$TMP"
          done
          if [ ${#NEEDS_NORMALIZE[@]} -gt 0 ]; then
            echo "❌ Folgende Workflows sind nicht normalisiert:"
            printf '  - %s\n' "${NEEDS_NORMALIZE[@]}"
            echo ""
            echo "Lokal fixen: node scripts/n8n-cli.mjs normalize --in <file> --out <file>"
            echo "Pre-Commit-Hook sollte das automatisch tun (siehe .git-hooks/pre-commit)."
            exit 1
          fi
          echo "✅ Alle Workflows sind normalisiert."
