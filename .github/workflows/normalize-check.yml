# Workflow-JSON Normalize-Check — n8n-template v0.6.1+
#
# Pre-Merge-Check: scheitert wenn workflows/*.json nicht normalisiert ist
# (z.B. position-Felder, versionId, instanceId noch drin).

name: Normalize Check

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'workflows/**.json'

permissions:
  contents: read

jobs:
  normalize-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Pruefe Normalize-Status
        run: |
          if ! node scripts/n8n-cli.mjs normalize workflows --check; then
            echo ""
            echo "Lokal fixen: node scripts/n8n-cli.mjs normalize workflows"
            echo "Pre-Commit-Hook sollte das automatisch tun (siehe .git-hooks/pre-commit)."
            exit 1
          fi
          echo "Alle Workflows sind normalisiert."
