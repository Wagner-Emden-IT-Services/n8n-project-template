name: Feature Request
description: Vorschlag fuer eine neue Funktion oder Verbesserung
title: '[FEATURE] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du dir die Zeit nimmst, das Template zu verbessern. Bitte beschreibe den Use-Case so konkret wie moeglich.

  - type: textarea
    id: usecase
    attributes:
      label: Use-Case
      description: Welches Problem willst du loesen? Was ist heute schmerzhaft oder unmoeglich?
      placeholder: 'Ich moechte vor jedem Deploy automatisch die Pin-Daten gegen den Workflow ausfuehren, um Regressionen zu fangen.'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Vorgeschlagene Loesung
      description: Wie koennte das Template das loesen? Konkreter Vorschlag, wenn moeglich.
      placeholder: 'node scripts/n8n-cli.mjs deploy <file> --smoke-test laedt tests/pins/<name>.json und ruft test_workflow ueber den offiziellen MCP.'

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Was hast du schon probiert oder erwogen? Warum reicht es nicht?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope-Check (Template ist auf 1-3 Dev-Teams ausgelegt)
      options:
        - label: Das Feature ist auch fuer kleine Teams sinnvoll (kein reines Enterprise-Setup)
          required: true
