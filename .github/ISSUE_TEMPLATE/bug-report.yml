name: Bug Report
description: Unerwartetes Verhalten oder Fehler melden
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Danke fuer deinen Bug-Report. Bitte fuelle alle Felder so vollstaendig wie moeglich aus.
        Fuer Sicherheits-Themen bitte NICHT hier melden — siehe [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert, was sollte stattdessen passieren?
      placeholder: 'deploy --auto-rollback bricht mit Exit-Code 2 ab, obwohl der Rollback-PUT laut Logs erfolgreich war.'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. `node scripts/n8n-cli.mjs deploy workflows/foo.json --env=staging --auto-rollback`
        2. n8n-API antwortet auf PUT mit 422
        3. ...
    validations:
      required: true

  - type: input
    id: n8n-version
    attributes:
      label: n8n-Version
      placeholder: '2.x.x'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node-Version
      placeholder: '20.x'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      options:
        - Linux
        - macOS
        - Windows (Git-Bash)
        - Windows (PowerShell)
        - Andere
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevante Fehler-Output. **Sensible Daten (API-Keys, Tokens) bitte redaktieren.**
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Vor-Checks
      options:
        - label: Ich habe nach existierenden Issues mit aehnlichem Inhalt gesucht
          required: true
        - label: Ich habe keine Secrets / API-Keys im Bug-Report
          required: true
