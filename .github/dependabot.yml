version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      production-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
# Hinweis: Kein docker-Block. .mcp.json nutzt ghcr.io/czlonkowski/n8n-mcp:latest
# (bewusste Wahl, kein Pin → Dependabot kann nicht tracken). Falls auf konkrete
# Version umgestellt wird, hier wieder einen `package-ecosystem: docker`-Block
# hinzufuegen.
