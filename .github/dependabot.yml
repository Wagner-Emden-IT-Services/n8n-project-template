version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      production-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
# Hinweis: Kein docker-Block. Seit v0.4.0 nutzt .mcp.json `npx n8n-mcp@latest`
# statt des Docker-Images. Updates der n8n-mcp-Library greifen automatisch beim
# naechsten `npx`-Start (durch '@latest'). Falls Version-Pinning gewuenscht ist
# (z.B. 'n8n-mcp@2.51.1'), kann Dependabot den npm-Block automatisch tracken —
# `npx`-Aufrufe sind aber NICHT in package.json gelistet, daher derzeit
# Dependabot-untrackbar (bewusste Wahl: Komfort > Reproduzierbarkeit).
